[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permio-python"
version = "0.0.18"
description = "Generated Protocol Buffer and gRPC client code for the perms.io API"
readme = "README.md"
license = "Apache-2.0"
authors = [ { name = "perms.io", email = "support@perms.io" } ]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
# Generated with protocolbuffers/python v33.5 (gencode 6.33.5; also verified with
# protobuf 7.x) and grpc/python v1.76.0. googleapis-common-protos 1.70 is the
# first release that allows protobuf 6.
dependencies = [
  "protobuf>=6.33.5,<8",
  "grpcio>=1.76.0,<2",
  "googleapis-common-protos>=1.70.0,<2",
]

[project.urls]
Homepage = "https://perms.io"
Source = "https://github.com/PrivateJAR/permio-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]
