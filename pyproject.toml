[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permio-python"
version = "0.0.11"
description = "Generated Protocol Buffer Python code for Permio"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [ { name = "Permio", email = "support@example.com" } ]
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/PrivateJAR/permio-python"
Source = "https://github.com/PrivateJAR/permio-python"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
