[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "permio"
dynamic = ["version"]
description = "Python SDK for perms.io: RBAC and fine-grained authorization as a service. Permission checks, grants, groups and access queries over gRPC"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PrivateJAR", email = "support@perms.io" }]
requires-python = ">=3.9"
keywords = ["permio", "perms.io", "permissions", "permissions-api", "rbac", "authorization", "authz", "access-control", "fine-grained-authorization", "multi-tenant", "acl", "grpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
# The generated code (src/permio/{permissions,organisation,pagination,validate})
# is built with protocolbuffers/python v33.5 (gencode 6.33.5; also verified with
# protobuf 7.x) and grpc/python v1.76.0. googleapis-common-protos provides
# google.api annotations and google.rpc (status, RetryInfo).
dependencies = [
  "protobuf>=6.33.5,<8",
  "grpcio>=1.76.0,<2",
  "googleapis-common-protos>=1.70.0,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]
dev = [
  "permio[test]",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-protobuf",
  "types-grpcio",
  "build",
  "twine",
]

[project.urls]
Homepage = "https://perms.io"
Documentation = "https://docs.perms.io"
Source = "https://github.com/PrivateJAR/permio-python"
Changelog = "https://github.com/PrivateJAR/permio-python/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "permio._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: integration tests against a real deployment (need PERMIO_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
# Generated by protoc; regenerated by PrivateJAR/proto releases.
extend-exclude = [
  "src/permio/permissions",
  "src/permio/organisation",
  "src/permio/pagination",
  "src/permio/validate",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501", # the formatter wraps code; long docstring lines are fine
  "UP006", # typing.List etc. keep the annotations readable on 3.9
  "UP007", # Optional[X]: X | None needs 3.10 at runtime in dataclasses
  "UP035",
  "UP045",
  "RUF022", # __all__ grouped, not sorted
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
strict = true
files = ["src/permio"]
exclude = ['^src/permio/(permissions|organisation|pagination|validate)/']

# Generated stubs: the *_pb2 modules have .pyi files; the *_pb2_grpc modules
# are untyped. Don't type-check generated code.
[[tool.mypy.overrides]]
module = [
  "permio.permissions.*",
  "permio.organisation.*",
  "permio.pagination.*",
  "permio.validate.*",
]
ignore_errors = true

# googleapis-common-protos ships no type information for google.rpc.
[[tool.mypy.overrides]]
module = ["google.rpc.*"]
ignore_missing_imports = true
